# Install as .github/workflows/aousd-ci-dispatch.yml in the OpenUSD Source repository.
name: Dispatch AOUSD BuildUSD

on:
  push:
    branches:
      - build-ig
      - dev
    tags:
      - 'v[0-9][0-9].[0-9][0-9]'
  pull_request_target:
    branches:
      - build-ig
      - dev
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  dispatch:
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve source revision
        id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd #v8
        with:
          github-token: ${{ github.token }}
          script: |
            const isPullRequest = context.eventName === "pull_request_target";
            let sourceRef = context.payload.ref;
            let sourceSha = context.payload.after;
            if (isPullRequest) {
              const MERGEABILITY_TIMEOUT_MS = 5 * 60 * 1000;
              const MERGEABILITY_RETRY_DELAY_MS = 2000;
              const deadline = Date.now() + MERGEABILITY_TIMEOUT_MS;
              const pullNumber = context.payload.pull_request.number;
              let pullRequest;
              while (Date.now() < deadline) {
                ({data: pullRequest} = await github.rest.pulls.get({
                  ...context.repo,
                  pull_number: pullNumber,
                }));
                if (pullRequest.mergeable !== null) {
                  break;
                }
                const remainingMs = deadline - Date.now();
                if (remainingMs > 0) {
                  await new Promise((resolve) =>
                    setTimeout(resolve, Math.min(MERGEABILITY_RETRY_DELAY_MS, remainingMs)));
                }
              }
              if (pullRequest.mergeable === false) {
                core.setFailed(`Pull request ${pullNumber} cannot be merged`);
                return;
              }
              sourceRef = `refs/pull/${pullNumber}/merge`;
              sourceSha = pullRequest.merge_commit_sha;
            }
            if (!sourceSha) {
              core.setFailed("GitHub did not finish computing a source commit to test");
              return;
            }
            core.setOutput("event-name", isPullRequest ? "pull_request" : "push");
            core.setOutput("ref", sourceRef);
            core.setOutput("sha", sourceSha);
      - name: Create CI dispatcher token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 #v2
        with:
          app-id: ${{ vars.AOUSD_CI_APP_ID }}
          private-key: ${{ secrets.AOUSD_CI_APP_PRIVATE_KEY }}
          owner: ${{ vars.AOUSD_CI_REPOSITORY_OWNER }}
          repositories: ${{ vars.AOUSD_CI_REPOSITORY_NAME }}
          permission-actions: write
      - name: Dispatch BuildUSD
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd #v8
        env:
          AOUSD_CI_REPOSITORY_NAME: ${{ vars.AOUSD_CI_REPOSITORY_NAME }}
          AOUSD_CI_REPOSITORY_OWNER: ${{ vars.AOUSD_CI_REPOSITORY_OWNER }}
          AOUSD_CI_WORKFLOW: buildusd.yml
          AOUSD_CI_WORKFLOW_REF: aousd-ci-cd-ct
          SOURCE_EVENT_NAME: ${{ steps.source.outputs.event-name }}
          SOURCE_REF: ${{ steps.source.outputs.ref }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const isPullRequest = context.eventName === "pull_request_target";
            const pullRequest = context.payload.pull_request;
            const inputs = {
              source_event_name: process.env.SOURCE_EVENT_NAME,
              source_ref: process.env.SOURCE_REF,
              source_repository: context.payload.repository.full_name,
              source_sha: process.env.SOURCE_SHA,
            };
            if (isPullRequest) {
              inputs.pull_request = String(pullRequest.number);
              inputs.source_base_ref = pullRequest.base.ref;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: process.env.AOUSD_CI_REPOSITORY_OWNER,
              repo: process.env.AOUSD_CI_REPOSITORY_NAME,
              workflow_id: process.env.AOUSD_CI_WORKFLOW,
              ref: process.env.AOUSD_CI_WORKFLOW_REF,
              inputs,
            });
